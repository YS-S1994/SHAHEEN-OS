name: Android Release (manual, guarded)

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release tag to create (e.g. v1.0.2)'
        required: true
        type: string
      release_name:
        description: 'Optional release title'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      BUILD_VARIANT: vanillaRelease
      BUILD_TOOLS_VERSION: "33.0.2"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify requested tag does not already exist on origin
        run: |
          TAG="${{ github.event.inputs.version_tag }}"
          if git ls-remote --tags origin | grep -q "refs/tags/$TAG$"; then
            echo "ERROR: Tag $TAG already exists on origin. Aborting to avoid overwrite."
            exit 1
          fi
          echo "Tag $TAG not present on origin."

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install Android SDK components
        uses: android-actions/setup-android@v3
        with:
          api-level: 37
          components: "platform-tools,build-tools;${{ env.BUILD_TOOLS_VERSION }}"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Fail fast if production signing secrets are missing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: Required signing secrets missing. Please set KEYSTORE_BASE64, KEY_ALIAS and KEY_PASSWORD in repository secrets."
            exit 1
          fi
          echo "Signing secrets present."

      - name: Create temporary secure dir and ensure cleanup
        run: |
          mkdir -p .github/secrets
          # ensure cleaned up on exit
          cat <<'EOF' > .github/secrets/cleanup.sh
          #!/bin/sh
          rm -f .github/secrets/release.jks
          rm -f signing.properties
          EOF
          chmod +x .github/secrets/cleanup.sh

      - name: Decode keystore to temporary file
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > .github/secrets/release.jks
          chmod 600 .github/secrets/release.jks

      - name: Write signing.properties for Gradle (used by app/build.gradle.kts)
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > signing.properties <<EOF
          KEY_ALIAS=${KEY_ALIAS}
          KEY_PASSWORD=${KEY_PASSWORD}
          STORE_FILE=.github/secrets/release.jks
          EOF
          chmod 600 signing.properties

      - name: Clean
        run: ./gradlew clean --no-daemon --stacktrace

      - name: Assemble release APK (vanilla)
        run: ./gradlew :app:assembleVanillaRelease --no-daemon --stacktrace

      - name: Locate release APK
        id: find_apk
        run: |
          APK=$(find app/build/outputs/apk -type f -name "*vanilla*-release*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "ERROR: Release APK not found."
            exit 1
          fi
          echo "Found APK: $APK"
          echo "apk=$APK" >> $GITHUB_OUTPUT

      - name: Verify APK signature with apksigner
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          APK="${{ steps.find_apk.outputs.apk }}"
          echo "Verifying signature of $APK"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/${{ env.BUILD_TOOLS_VERSION }}/apksigner"
          if [ ! -x "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found at $APKSIGNER"
            exit 1
          fi
          "$APKSIGNER" verify --print-certs "$APK" || { echo "ERROR: apksigner verification failed"; exit 1; }

      - name: Dump package info (aapt) to validate packageName and version
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          APK="${{ steps.find_apk.outputs.apk }}"
          AAPT="$ANDROID_SDK_ROOT/build-tools/${{ env.BUILD_TOOLS_VERSION }}/aapt"
          if [ -x "$AAPT" ]; then
            echo "aapt dump badging:"
            "$AAPT" dump badging "$APK" | sed -n '1,40p'
          else
            echo "aapt not found; skipping package badging dump."
          fi

      - name: Create GitHub Release (tag + upload asset) safely
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.event.inputs.version_tag }}
          release_name: ${{ github.event.inputs.release_name || github.event.inputs.version_tag }}
          body: |
            Release ${{ github.event.inputs.version_tag }}
            Built by GitHub Actions.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK to Release
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ steps.find_apk.outputs.apk }}
          asset_name: SHAHEEN-OS-${{ github.event.inputs.version_tag }}.apk
          asset_content_type: application/vnd.android.package-archive

      - name: Cleanup sensitive files
        if: always()
        run: |
          .github/secrets/cleanup.sh
